name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-kotlin-code-format:
    name: Check Kotlin code format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run ktlint check
        run: cd android && ./gradlew ktlintCheck

  check-scala-code-format:
    name: Check Scala code format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache Dependencies
        uses: coursier/cache-action@v6

      - name: Run scalafmt check
        run: cd backend && sbt scalafmtCheck

  build-android-app:
    name: Build Android app
    needs: [ check-kotlin-code-format ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug apk
        run: cd android && ./gradlew app:assembleDebug

      - name: Store APK file
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ./android/app/build/outputs/apk/debug/app-debug.apk

  test-backend-app:
    name: Run Backend tests
    needs: [ check-scala-code-format ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache Dependencies
        uses: coursier/cache-action@v6

      - name: Run tests
        run: cd backend && sbt test

  build-backend-app:
    name: Build Backend app
    needs: [ check-scala-code-format ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache Dependencies
        uses: coursier/cache-action@v6

      - name: Build jar file
        run: cd backend && sbt app/assembly

      - name: Store jar file
        uses: actions/upload-artifact@v4
        with:
          name: simple-split-backend.jar
          path: ./backend/app/target/scala-3.7.4/leetcode-quiz-backend.jar
